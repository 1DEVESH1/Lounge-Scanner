<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lounge Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --accent:#00e5c0;
  --accent2:#7c6ff7;
  --red:#ff4d6d;
  --amber:#ffb830;
  --green:#00e5c0;
  --text:#e8eaf6;
  --muted:rgba(232,234,246,0.5);
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(124,111,247,0.15) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 80%,rgba(0,229,192,0.1) 0%,transparent 60%);
}
.app{max-width:480px;margin:0 auto;padding:16px;padding-bottom:40px}
.header{text-align:center;padding:24px 0 20px}
.header .logo{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.header .logo span{color:var(--accent)}
.header p{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px)}
.card-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px}
#qr-reader{width:100%;border-radius:12px;overflow:hidden;background:#000}
#qr-reader video{border-radius:12px}
.scan-toggle{display:flex;gap:8px;margin-bottom:14px}
.tab-btn{flex:1;padding:10px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.tab-btn.active{background:rgba(0,229,192,0.15);border-color:var(--accent);color:var(--accent)}
textarea,select,input[type=text],input[type=number]{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border .2s}
textarea{resize:vertical;min-height:80px;font-size:13px;border-radius:12px}
textarea:focus,select:focus,input:focus{border-color:var(--accent)}
textarea::placeholder,input::placeholder{color:var(--muted)}
select option{background:#12162a;color:var(--text)}
label{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-bottom:6px;margin-top:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.3px;margin-top:14px}
.btn-validate{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#0a0e1a}
.btn-validate:hover{opacity:0.9;transform:translateY(-1px)}
.btn-redeem{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
.btn-redeem:hover{opacity:0.9;transform:translateY(-1px)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.badge-valid{background:rgba(0,229,192,0.15);color:var(--green);border:1px solid rgba(0,229,192,0.3)}
.badge-scheduled{background:rgba(255,184,48,0.15);color:var(--amber);border:1px solid rgba(255,184,48,0.3)}
.badge-invalid{background:rgba(255,77,109,0.15);color:var(--red);border:1px solid rgba(255,77,109,0.3)}
.badge-redeemed{background:rgba(255,184,48,0.15);color:var(--amber);border:1px solid rgba(255,184,48,0.3)}
.info-banner{background:rgba(124,111,247,0.12);border:1px solid rgba(124,111,247,0.35);border-radius:12px;padding:14px;font-size:13px;line-height:1.5;color:var(--text)}
.info-banner strong{color:var(--accent);font-weight:600}
.info-banner .info-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--accent2);margin-bottom:6px}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:12px;color:var(--muted);font-weight:500}
.detail-value{font-size:14px;font-weight:600;text-align:right;max-width:60%}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
.error-msg{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:10px;padding:12px;font-size:13px;color:var(--red);margin-top:12px;word-break:break-all}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.scanning-label{text-align:center;color:var(--accent);font-size:13px;font-weight:500;margin-top:8px;animation:pulse 1.5s ease-in-out infinite}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-green{background:var(--green)}
.dot-red{background:var(--red)}
.dot-amber{background:var(--amber)}
.section-heading{font-size:16px;font-weight:700;margin-bottom:4px}
.divider{height:1px;background:var(--border);margin:16px 0}
.duration-block{background:rgba(0,229,192,0.08);border:1px solid rgba(0,229,192,0.22);border-radius:14px;padding:14px;margin-top:4px}
.duration-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--accent);margin-bottom:12px}
.duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.duration-item{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.duration-item.total{background:rgba(124,111,247,0.15);border-color:rgba(124,111,247,0.35)}
.duration-label{display:block;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.duration-value{display:block;font-size:16px;font-weight:700;color:var(--text);line-height:1.2}
.duration-sub{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.duration-timeline{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)}
.duration-timeline .detail-row{padding:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.progress-pill{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(0,229,192,0.12);border:1px solid rgba(0,229,192,0.3);color:var(--accent);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">🛂 Lounge<span>Scanner</span></div>
    <p>Scan lounge bookings &amp; access vouchers</p>
  </div>

  <div class="card hidden" id="step-loading">
    <div class="card-title">Loading</div>
    <p class="scanning-label" style="margin-top:0">Validating QR…</p>
  </div>

  <div class="card" id="step-scan">
    <div class="card-title">Redeem</div>
    <div class="scan-toggle">
      <button class="tab-btn" id="tab-booking-type" onclick="switchCredentialType('booking')">Lounge Booking</button>
      <button class="tab-btn active" id="tab-voucher-type" onclick="switchCredentialType('voucher')">Access Voucher</button>
    </div>

    <!-- Access Voucher — validate first, then outlet → service from program mappings -->
    <div id="voucher-flow">
      <label>Step 1 — Voucher code / QR</label>
      <div class="scan-toggle" style="margin-top:4px">
        <button type="button" class="tab-btn active" id="tab-voucher-paste" onclick="switchVoucherInput('paste')">📋 Paste</button>
        <button type="button" class="tab-btn" id="tab-voucher-camera" onclick="switchVoucherInput('camera')">📷 Scan QR</button>
      </div>
      <div id="voucher-paste-section">
        <textarea id="voucher-token-input" placeholder="Paste voucher code or QR token" oninput="onVoucherCredentialInput()"></textarea>
      </div>
      <div id="voucher-camera-section" class="hidden">
        <div id="voucher-qr-reader"></div>
        <p class="scanning-label" id="voucher-scan-status">Point camera at voucher QR…</p>
        <button type="button" class="btn btn-secondary" style="margin-top:10px" onclick="stopVoucherCamera()">⏹ Stop Camera</button>
      </div>

      <div id="voucher-loading-block" class="hidden" style="margin-top:12px">
        <p class="scanning-label" style="margin-top:0">Checking voucher…</p>
      </div>

      <div id="voucher-status-block" class="hidden" style="margin-top:14px">
        <div id="voucher-status-badge" style="margin-bottom:10px"></div>
        <div id="voucher-status-details"></div>
      </div>

      <div id="voucher-selection-block" class="hidden">
        <label for="voucher-outlet">Step 2 — Outlet / location</label>
        <select id="voucher-outlet" onchange="onVoucherOutletPick()">
          <option value="">— Select outlet —</option>
        </select>

        <label for="voucher-service" id="voucher-service-label" class="hidden">Step 3 — Service</label>
        <div id="voucher-service-block" class="hidden">
          <select id="voucher-service" onchange="onVoucherServicePick()" disabled>
            <option value="">— Select outlet first —</option>
          </select>
        </div>

        <label for="voucher-billable">Billable amount (₹)</label>
        <input type="text" inputmode="decimal" id="voucher-billable" placeholder="Enter bill amount" oninput="onVoucherBillableChange()"/>

        <button class="btn btn-validate" id="voucher-preview-btn" onclick="previewVoucher()" disabled>
          🔍 Preview quote
        </button>

        <div id="voucher-preview-block" class="hidden" style="margin-top:14px">
          <div id="voucher-preview-badge" style="margin-bottom:10px"></div>
          <div id="voucher-preview-details"></div>
          <div class="divider"></div>
          <button class="btn btn-redeem" id="voucher-redeem-btn" onclick="redeemVoucher()" disabled>
            ✅ Confirm redeem
          </button>
        </div>
      </div>

      <p class="hint" id="voucher-redeem-hint">
        Scan or paste the voucher first. Then select outlet and service — single options are auto-selected.
      </p>
    </div>

    <!-- Lounge booking flow -->
    <div id="booking-flow" class="hidden">
      <div class="scan-toggle" style="margin-top:4px">
        <button class="tab-btn active" id="tab-camera" onclick="switchBookingInput('camera')">📷 Camera</button>
        <button class="tab-btn" id="tab-paste" onclick="switchBookingInput('paste')">📋 Paste Token</button>
      </div>
      <div id="camera-section">
        <div id="qr-reader"></div>
        <p class="scanning-label" id="scan-status">Point camera at booking QR…</p>
        <button class="btn btn-secondary" style="margin-top:10px" onclick="stopCamera()">⏹ Stop Camera</button>
      </div>
      <div id="paste-section" class="hidden">
        <label for="token-input">Paste booking JWT</label>
        <textarea id="token-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
        <label for="outlet-input">Outlet ID</label>
        <input type="text" id="outlet-input" placeholder="Required if not embedded in JWT"/>
        <button class="btn btn-validate" id="validate-btn" onclick="validatePastedCredential()">Validate Booking</button>
      </div>
    </div>

    <div id="scan-error" class="error-msg hidden"></div>
  </div>

  <!-- Booking result -->
  <div class="card hidden" id="step-result">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">Booking Details</div>
      <div id="valid-badge"></div>
    </div>
    <div id="booking-details"></div>
    <div id="rejection-block" class="hidden">
      <div class="divider"></div>
      <div id="rejection-reason" class="error-msg" style="margin-top:0"></div>
    </div>
    <div id="scheduled-block" class="hidden">
      <div class="divider"></div>
      <div id="scheduled-message" class="info-banner"></div>
    </div>
    <div id="redeem-block" class="hidden">
      <div class="divider"></div>
      <button class="btn btn-redeem" id="redeem-btn" onclick="redeemBooking()">
        ✅ Confirm Entry — Redeem Booking
      </button>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px" onclick="resetAll()">🔄 Scan Another</button>
  </div>

  <div class="card hidden" id="step-redeem">
    <div class="card-title">Redemption</div>
    <div id="redeem-result"></div>
    <button class="btn btn-secondary" style="margin-top:14px" onclick="resetAll()">🔄 Scan Another</button>
  </div>

</div>

<script>
let html5Scanner = null;
let scannerStarted = false;
let voucherHtml5Scanner = null;
let voucherScannerStarted = false;
let currentValidation = null; // booking
let currentVoucherPreview = null;
let voucherSession = {
  cred: null,
  validateData: null,
  redemptionOptions: null,
  selectedOutletId: null,
  selectedServiceLocationId: null,
};
let voucherValidateTimer = null;

/** Human voucher codes look like PREFIX-HEX (e.g. AIR-B37B4AC3CE01). */
function looksLikeVoucherCode(text) {
  return /^[A-Z0-9][A-Z0-9_-]*-[A-F0-9]{8,}$/i.test(text);
}

/** Issued qrToken is base64url from 32 random bytes (~43 chars). */
function looksLikeQrToken(text) {
  return text.length >= 24 && /^[A-Za-z0-9_-]+$/.test(text) && !looksLikeVoucherCode(text);
}

function classifyCredential(raw) {
  const text = String(raw || "").trim();
  if (!text) return null;
  if (text.startsWith("eyJ")) return { kind: "booking", token: text };
  try {
    const url = new URL(text);
    const qrToken = url.searchParams.get("qrToken");
    const code = url.searchParams.get("code");
    const token = url.searchParams.get("token");
    if (qrToken) return { kind: "voucher", token: qrToken, asCode: looksLikeVoucherCode(qrToken) };
    if (code) return { kind: "voucher", token: code, asCode: true };
    if (token) {
      if (token.startsWith("eyJ")) return { kind: "booking", token };
      return {
        kind: "voucher",
        token,
        asCode: looksLikeVoucherCode(token) || !looksLikeQrToken(token),
      };
    }
  } catch (_) {}
  if (looksLikeVoucherCode(text)) return { kind: "voucher", token: text, asCode: true };
  if (looksLikeQrToken(text)) return { kind: "voucher", token: text, asCode: false };
  if (text.length >= 4) return { kind: "voucher", token: text, asCode: true };
  return null;
}

function decodeOutletFromToken(token) {
  try {
    return JSON.parse(atob(String(token || "").split(".")[1])).out || "";
  } catch (_) {
    return "";
  }
}

function showDeepLinkLoading() {
  document.getElementById("step-loading").classList.remove("hidden");
  document.getElementById("step-scan").classList.add("hidden");
  document.getElementById("step-result").classList.add("hidden");
  document.getElementById("step-redeem").classList.add("hidden");
}

function hideDeepLinkLoading() {
  document.getElementById("step-loading").classList.add("hidden");
}

function stripTokenFromUrl() {
  if (!window.location.search) return;
  history.replaceState({}, "", window.location.pathname || "/");
}

function switchBookingInput(tab) {
  document.getElementById("tab-camera").classList.toggle("active", tab === "camera");
  document.getElementById("tab-paste").classList.toggle("active", tab === "paste");
  document.getElementById("camera-section").classList.toggle("hidden", tab !== "camera");
  document.getElementById("paste-section").classList.toggle("hidden", tab !== "paste");
  if (tab === "camera") startCamera();
  else stopCamera();
}

function switchCredentialType(type) {
  const isVoucher = type === "voucher";
  document.getElementById("tab-voucher-type").classList.toggle("active", isVoucher);
  document.getElementById("tab-booking-type").classList.toggle("active", !isVoucher);
  document.getElementById("voucher-flow").classList.toggle("hidden", !isVoucher);
  document.getElementById("booking-flow").classList.toggle("hidden", isVoucher);
  hideScanError();
  if (isVoucher) {
    stopCamera();
  } else {
    stopVoucherCamera();
    switchVoucherInput("paste");
    switchBookingInput("camera");
  }
}

function switchVoucherInput(tab) {
  document.getElementById("tab-voucher-paste").classList.toggle("active", tab === "paste");
  document.getElementById("tab-voucher-camera").classList.toggle("active", tab === "camera");
  document.getElementById("voucher-paste-section").classList.toggle("hidden", tab !== "paste");
  document.getElementById("voucher-camera-section").classList.toggle("hidden", tab !== "camera");
  if (tab === "camera") {
    stopCamera();
    startVoucherCamera();
  } else {
    stopVoucherCamera();
  }
}

function startVoucherCamera() {
  if (voucherScannerStarted) return;
  const statusEl = document.getElementById("voucher-scan-status");
  statusEl.textContent = "Starting camera…";
  voucherHtml5Scanner = new Html5Qrcode("voucher-qr-reader");
  voucherHtml5Scanner
    .start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onVoucherQrScanned,
      () => {}
    )
    .then(() => {
      voucherScannerStarted = true;
      statusEl.textContent = "Point camera at voucher QR…";
    })
    .catch((err) => {
      showScanError("Camera error: " + err + ". Use the Paste tab instead.");
      switchVoucherInput("paste");
    });
}

function stopVoucherCamera() {
  if (voucherHtml5Scanner && voucherScannerStarted) {
    voucherHtml5Scanner.stop().catch(() => {});
    voucherScannerStarted = false;
  }
}

function onVoucherQrScanned(decodedText) {
  stopVoucherCamera();
  document.getElementById("voucher-scan-status").textContent = "✅ QR scanned!";
  const cred = classifyCredential(decodedText);
  if (!cred || cred.kind !== "voucher") {
    showScanError("Could not read a voucher code or token from this QR. Scan again or paste manually.");
    switchVoucherInput("paste");
    return;
  }
  hideScanError();
  document.getElementById("voucher-token-input").value = cred.token;
  switchVoucherInput("paste");
  void validateVoucherOnly();
}

function startCamera() {
  if (scannerStarted) return;
  stopVoucherCamera();
  html5Scanner = new Html5Qrcode("qr-reader");
  html5Scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    onQrScanned,
    () => {}
  ).then(() => {
    scannerStarted = true;
    document.getElementById("scan-status").textContent = "Point camera at QR code…";
  }).catch((err) => {
    showScanError("Camera error: " + err + ". Use the Paste tab instead.");
    switchBookingInput("paste");
  });
}

function stopCamera() {
  if (html5Scanner && scannerStarted) {
    html5Scanner.stop().catch(() => {});
    scannerStarted = false;
  }
}

async function onQrScanned(decodedText) {
  stopCamera();
  document.getElementById("scan-status").textContent = "✅ QR scanned!";
  await routeCredential(decodedText);
}

async function validatePastedCredential() {
  hideScanError();
  const text = document.getElementById("token-input").value.trim();
  await routeCredential(text, document.getElementById("outlet-input").value.trim());
}

function unwrapApiData(json) {
  if (json?.body?.data) return json.body.data;
  if (json?.data && typeof json.data === "object" && !Array.isArray(json.data)) {
    if (
      json.data.valid !== undefined ||
      json.data.voucher ||
      json.data.redemptionOptions ||
      json.data.kind
    ) {
      return json.data;
    }
  }
  return json?.data ?? json;
}

function apiErrorMessage(json) {
  const raw =
    json?.message ||
    json?.error ||
    json?.body?.message ||
    json?.detail ||
    json?.data?.message ||
    (Array.isArray(json?.errors) && json.errors[0]?.message) ||
    null;
  if (raw && String(raw).includes("max_pax")) {
    return (
      "Promotional service outdated (max_pax column removed). " +
      "Redeploy the promotional service on dev and restart Lounge-Scanner."
    );
  }
  return raw;
}

function formatOutletLabel(outlet) {
  if (!outlet) return "Unknown outlet";
  const name = outlet.code
    ? `${outlet.name} (${outlet.code})`
    : outlet.name || outlet.id;
  if (outlet.locationLabel) return `${name} — ${outlet.locationLabel}`;
  return name;
}

function formatServiceLabel(svc) {
  return svc.displayName || svc.serviceName || "Service";
}

function setServiceBlockVisible(visible) {
  document.getElementById("voucher-service-block").classList.toggle("hidden", !visible);
  document.getElementById("voucher-service-label").classList.toggle("hidden", !visible);
}

function parseBillableAmount(raw) {
  const n = Number(String(raw || "").replace(/,/g, "").trim());
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function parseVoucherCredential(raw) {
  const cred = classifyCredential(raw);
  if (!cred || cred.kind !== "voucher") return null;
  return { token: cred.token, asCode: Boolean(cred.asCode) };
}

function resetVoucherSession() {
  voucherSession = {
    cred: null,
    validateData: null,
    redemptionOptions: null,
    selectedOutletId: null,
    selectedServiceLocationId: null,
  };
  document.getElementById("voucher-loading-block").classList.add("hidden");
  document.getElementById("voucher-status-block").classList.add("hidden");
  document.getElementById("voucher-selection-block").classList.add("hidden");
  document.getElementById("voucher-outlet").innerHTML =
    '<option value="">— Select outlet —</option>';
  document.getElementById("voucher-service").innerHTML =
    '<option value="">— Select outlet first —</option>';
  document.getElementById("voucher-service").disabled = true;
  setServiceBlockVisible(false);
  clearVoucherPreview();
  updateVoucherPreviewButton();
}

function getRedeemableOutlets() {
  const outlets = voucherSession.redemptionOptions?.outlets || [];
  return outlets.filter((o) =>
    (o.services || []).some((s) => !s.alreadyRedeemed)
  );
}

function getRedeemableServices(outlet) {
  return (outlet?.services || []).filter((s) => !s.alreadyRedeemed);
}

function getSelectedOutlet() {
  const outletId = document.getElementById("voucher-outlet").value;
  return (voucherSession.redemptionOptions?.outlets || []).find(
    (o) => o.id === outletId
  );
}

function getSelectedService() {
  const slmId = document.getElementById("voucher-service").value;
  const outlet = getSelectedOutlet();
  return (outlet?.services || []).find((s) => s.serviceLocationId === slmId);
}

function onVoucherCredentialInput() {
  clearVoucherPreview();
  if (voucherValidateTimer) clearTimeout(voucherValidateTimer);
  const raw = document.getElementById("voucher-token-input").value.trim();
  if (!parseVoucherCredential(raw)) {
    resetVoucherSession();
    return;
  }
  voucherValidateTimer = setTimeout(() => void validateVoucherOnly(), 450);
}

async function validateVoucherOnly() {
  const rawCode = document.getElementById("voucher-token-input").value.trim();
  const cred = parseVoucherCredential(rawCode);
  if (!cred) {
    resetVoucherSession();
    return;
  }

  hideScanError();
  document.getElementById("voucher-loading-block").classList.remove("hidden");
  document.getElementById("voucher-status-block").classList.add("hidden");
  document.getElementById("voucher-selection-block").classList.add("hidden");
  clearVoucherPreview();

  const primary = cred.asCode
    ? { code: cred.token }
    : { qrToken: cred.token };
  const fallback = cred.asCode
    ? { qrToken: cred.token }
    : { code: cred.token };

  try {
    let res = await fetch("/api/voucher/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(primary),
    });
    let json = await res.json();

    if (!res.ok && shouldRetryAlternateCredential(res.status, json)) {
      res = await fetch("/api/voucher/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fallback),
      });
      json = await res.json();
    }

    document.getElementById("voucher-loading-block").classList.add("hidden");

    if (!res.ok) {
      resetVoucherSession();
      voucherSession.cred = cred;
      showScanError(apiErrorMessage(json) || "Voucher check failed");
      return;
    }

    const data = unwrapApiData(json);
    voucherSession.cred = cred;
    voucherSession.validateData = data;
    voucherSession.redemptionOptions = data.redemptionOptions || { outlets: [] };

    showVoucherStatus(data);
    if (data.valid) {
      populateOutletPicker();
      document.getElementById("voucher-selection-block").classList.remove("hidden");
      applyAutoSelection();
    } else {
      document.getElementById("voucher-selection-block").classList.add("hidden");
    }
  } catch (e) {
    document.getElementById("voucher-loading-block").classList.add("hidden");
    resetVoucherSession();
    showScanError("Network error: " + e.message);
  }
}

function showVoucherStatus(data) {
  const block = document.getElementById("voucher-status-block");
  const badge = document.getElementById("voucher-status-badge");
  const details = document.getElementById("voucher-status-details");
  const voucher = data.voucher || {};

  badge.innerHTML = data.valid
    ? '<span class="status-badge badge-valid"><span class="dot dot-green"></span>VALID</span>'
    : '<span class="status-badge badge-invalid"><span class="dot dot-red"></span>NOT REDEEMABLE</span>';

  const rows = [
    ["Voucher", voucher.code || "—"],
    ["Passenger", voucher.passengerName || "—"],
    ["Program", voucher.programTitle || voucher.programCode || "—"],
    ["Restriction", voucher.restriction || "—"],
    [
      "Usage",
      `${voucher.servicesRedeemedCount ?? 0} / ${voucher.servicesRedemptionCap ?? "—"}`,
    ],
    ["Valid until", voucher.validUntil ? fmtTime(voucher.validUntil) : "—"],
  ];

  details.innerHTML = rows
    .map(
      ([k, v]) =>
        `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`
    )
    .join("");
  block.classList.remove("hidden");
}

function populateOutletPicker() {
  const outletSel = document.getElementById("voucher-outlet");
  const outlets = voucherSession.redemptionOptions?.outlets || [];
  const redeemable = getRedeemableOutlets();

  outletSel.innerHTML = "";
  if (!outlets.length) {
    outletSel.appendChild(new Option("— No outlets mapped —", ""));
    outletSel.disabled = true;
    showScanError("No outlets are configured for this voucher.");
    return;
  }

  outletSel.appendChild(new Option("— Select outlet —", ""));
  for (const outlet of outlets) {
    const hasRedeemable = (outlet.services || []).some((s) => !s.alreadyRedeemed);
    const label = formatOutletLabel(outlet);
    const opt = new Option(
      hasRedeemable ? label : `${label} (all redeemed)`,
      outlet.id
    );
    if (!hasRedeemable) opt.disabled = true;
    outletSel.appendChild(opt);
  }
  outletSel.disabled = redeemable.length === 0;
  if (!redeemable.length) {
    showScanError("All mapped services on this voucher have already been redeemed.");
  }
}

function applyAutoSelection() {
  const redeemable = getRedeemableOutlets();
  if (redeemable.length === 1) {
    document.getElementById("voucher-outlet").value = redeemable[0].id;
    onVoucherOutletPick({ auto: true });
  }
}

function onVoucherOutletPick({ auto } = {}) {
  clearVoucherPreview();
  const outletId = document.getElementById("voucher-outlet").value;
  voucherSession.selectedOutletId = outletId || null;

  const outlet = getSelectedOutlet();
  const serviceSel = document.getElementById("voucher-service");
  serviceSel.innerHTML = "";

  if (!outletId || !outlet) {
    serviceSel.appendChild(new Option("— Select outlet first —", ""));
    serviceSel.disabled = true;
    setServiceBlockVisible(false);
    voucherSession.selectedServiceLocationId = null;
    updateVoucherPreviewButton();
    return;
  }

  setServiceBlockVisible(true);
  const allServices = outlet.services || [];
  const redeemable = getRedeemableServices(outlet);

  serviceSel.appendChild(new Option("— Select service —", ""));
  for (const svc of allServices) {
    const label = svc.alreadyRedeemed
      ? `${formatServiceLabel(svc)} (already redeemed)`
      : formatServiceLabel(svc);
    const opt = new Option(label, svc.serviceLocationId);
    if (svc.alreadyRedeemed) opt.disabled = true;
    serviceSel.appendChild(opt);
  }
  serviceSel.disabled = redeemable.length === 0;

  if (redeemable.length === 1) {
    serviceSel.value = redeemable[0].serviceLocationId;
    onVoucherServicePick();
  } else {
    serviceSel.value = "";
    voucherSession.selectedServiceLocationId = null;
    updateVoucherPreviewButton();
  }
}

function onVoucherServicePick() {
  clearVoucherPreview();
  const slmId = document.getElementById("voucher-service").value;
  voucherSession.selectedServiceLocationId = slmId || null;
  updateVoucherPreviewButton();
}

function onVoucherBillableChange() {
  clearVoucherPreview();
  updateVoucherPreviewButton();
}

function getVoucherSelections() {
  const outletId = document.getElementById("voucher-outlet").value;
  const outlet = getSelectedOutlet();
  return {
    outletId,
    locationId: outlet?.locationId || outlet?.airportId || undefined,
    serviceLocationId: document.getElementById("voucher-service").value,
  };
}

function swapVoucherCredential(payload, cred) {
  const next = { ...payload };
  if (cred.asCode) {
    delete next.code;
    next.qrToken = cred.token;
  } else {
    delete next.qrToken;
    next.code = cred.token;
  }
  return next;
}

function fmtMoney(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return "₹" + Number(n).toLocaleString("en-IN");
}

function redemptionTypeLabel(type) {
  if (type === "FULL_REDEEM") return "Full redeem";
  if (type === "DISCOUNTED_AMOUNT") return "Discounted amount";
  return type || "—";
}

function clearVoucherPreview() {
  currentVoucherPreview = null;
  document.getElementById("voucher-preview-block").classList.add("hidden");
  document.getElementById("voucher-preview-details").innerHTML = "";
  document.getElementById("voucher-preview-badge").innerHTML = "";
  const redeemBtn = document.getElementById("voucher-redeem-btn");
  redeemBtn.disabled = true;
  redeemBtn.innerHTML = "✅ Confirm redeem";
}

function updateVoucherPreviewButton() {
  const { outletId, serviceLocationId } = getVoucherSelections();
  const billable = parseBillableAmount(
    document.getElementById("voucher-billable").value
  );
  const ready = Boolean(
    voucherSession.cred && outletId && serviceLocationId && billable > 0
  );
  document.getElementById("voucher-preview-btn").disabled = !ready;
}

async function routeCredential(raw, pastedOutletId) {
  const cred = classifyCredential(raw);
  if (!cred) {
    showScanError("Could not read a booking or access voucher from that QR.");
    return;
  }
  stripTokenFromUrl();
  if (cred.kind === "booking") {
    const outletId = decodeOutletFromToken(cred.token) || pastedOutletId || "";
    if (!outletId) {
      switchBookingInput("paste");
      document.getElementById("token-input").value = cred.token;
      showScanError("Could not auto-detect outletId from booking QR. Enter Outlet ID and Validate.");
      return;
    }
    await callBookingValidate(cred.token, outletId);
    return;
  }
  switchCredentialType("voucher");
  document.getElementById("voucher-token-input").value = cred.token;
  switchVoucherInput("paste");
  hideDeepLinkLoading();
  document.getElementById("step-scan").classList.remove("hidden");
  void validateVoucherOnly();
}

async function callBookingValidate(token, outletId) {
  setValidateLoading(true);
  try {
    const res = await fetch("/api/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, outletId }),
    });
    const json = await res.json();
    hideDeepLinkLoading();
    showBookingValidationResult(json, token, outletId);
  } catch (e) {
    hideDeepLinkLoading();
    document.getElementById("step-scan").classList.remove("hidden");
    showScanError("Network error: " + e.message);
  } finally {
    setValidateLoading(false);
  }
}

function setValidateLoading(loading) {
  const btn = document.getElementById("validate-btn");
  if (btn) btn.disabled = loading;
  if (btn) btn.innerHTML = loading ? '<span class="spinner"></span>Validating…' : "Validate";
}

function showBookingValidationResult(json, token, outletId) {
  const data = json.data || json;
  const isValid = data.valid === true;
  const canRedeemNow = data.loungeDetails?.canRedeemNow === true;
  const isAlreadyRedeemed = data.rejectionReason === "Booking already redeemed";

  document.getElementById("step-scan").classList.add("hidden");
  document.getElementById("step-result").classList.remove("hidden");

  let badgeHtml = "";
  if (isValid && canRedeemNow) {
    badgeHtml = '<span class="status-badge badge-valid"><span class="dot dot-green"></span>READY TO REDEEM</span>';
  } else if (isValid && !canRedeemNow) {
    badgeHtml = '<span class="status-badge badge-scheduled"><span class="dot dot-amber"></span>VALID</span>';
  } else if (isAlreadyRedeemed) {
    badgeHtml = '<span class="status-badge badge-redeemed"><span class="dot dot-amber"></span>ALREADY REDEEMED</span>';
  } else {
    badgeHtml = '<span class="status-badge badge-invalid"><span class="dot dot-red"></span>REJECTED</span>';
  }
  document.getElementById("valid-badge").innerHTML = badgeHtml;

  let detailsHtml = "";
  if (isValid || isAlreadyRedeemed) {
    const bs = data.bookingSummary || {};
    const ld = data.loungeDetails || {};
    const serviceStart = ld.serviceStartTime || ld.redeemableFrom || ld.startTime;
    const serviceEnd = ld.serviceEndTime || ld.redeemableUntil || ld.expiresAt;
    const redeemUntil = ld.redeemableUntil || ld.expiresAt;
    const rows = [
      ["Booking Ref", data.bookingRef || "—"],
      ["Passengers", data.passengerCount ?? "—"],
      ["Lounge", ld.outletName || "—"],
      ["Variant", ld.variantName || "—"],
      ["Travel Date", bs.travelDate ? fmtDate(bs.travelDate) : "—"],
      ["Journey", bs.journeyType || "—"],
      ["Service Starts", serviceStart ? fmtTime(serviceStart) : "—"],
      ["Service Ends", serviceEnd ? fmtTime(serviceEnd) : "—"],
      ["Redeemable From", ld.redeemableFrom ? fmtTime(ld.redeemableFrom) : (serviceStart ? fmtTime(serviceStart) : "—")],
      ["Redeemable Until", redeemUntil ? fmtTime(redeemUntil) : "—"],
      ["Redemption", redemptionStatusLabel(isValid, canRedeemNow, serviceStart)],
      ["Status", bs.status || "—"],
    ];
    detailsHtml = rows.map(([k, v]) =>
      `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`
    ).join("");
    detailsHtml += buildDurationBlock(ld);
    currentValidation = isValid && canRedeemNow
      ? { bookingId: data.bookingId, bookingItemId: data.bookingItemId, outletId, token }
      : null;
  } else {
    detailsHtml = '<div class="detail-row"><span class="detail-label">Booking Ref</span><span class="detail-value">—</span></div>';
    currentValidation = null;
  }
  document.getElementById("booking-details").innerHTML = detailsHtml;

  const rejBlock = document.getElementById("rejection-block");
  if (!isValid) {
    rejBlock.classList.remove("hidden");
    document.getElementById("rejection-reason").textContent =
      "⛔ " + humanRejection(data.rejectionReason || "Unknown error");
  } else {
    rejBlock.classList.add("hidden");
  }

  const scheduledBlock = document.getElementById("scheduled-block");
  if (isValid && !canRedeemNow) {
    scheduledBlock.classList.remove("hidden");
    const ld = data.loungeDetails || {};
    const redeemFrom = ld.redeemableFrom || ld.serviceStartTime || ld.startTime;
    document.getElementById("scheduled-message").innerHTML = buildScheduledMessage(data, redeemFrom);
  } else {
    scheduledBlock.classList.add("hidden");
  }

  const redeemBlock = document.getElementById("redeem-block");
  if (isValid && canRedeemNow && currentValidation) redeemBlock.classList.remove("hidden");
  else redeemBlock.classList.add("hidden");
}

async function redeemBooking() {
  if (!currentValidation) return;
  const btn = document.getElementById("redeem-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Redeeming…';
  try {
    const res = await fetch("/api/redeem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        bookingId: currentValidation.bookingId,
        bookingItemId: currentValidation.bookingItemId,
        outletId: currentValidation.outletId,
      }),
    });
    const json = await res.json();
    showBookingRedeemResult(json);
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = "✅ Confirm Entry — Redeem Booking";
    alert("Network error: " + e.message);
  }
}

async function previewVoucher() {
  hideScanError();
  clearVoucherPreview();
  const { outletId, locationId, serviceLocationId } = getVoucherSelections();
  const cred = voucherSession.cred || parseVoucherCredential(
    document.getElementById("voucher-token-input").value.trim()
  );
  const billableAmount = parseBillableAmount(
    document.getElementById("voucher-billable").value
  );

  if (!outletId || !serviceLocationId) {
    alert("Select an outlet and service.");
    return;
  }
  if (!cred) {
    showScanError("Enter or scan a valid voucher code or QR token.");
    return;
  }
  if (!billableAmount) {
    showScanError("Enter a valid billable amount.");
    return;
  }

  const btn = document.getElementById("voucher-preview-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Checking…';

  const basePayload = {
    serviceLocationId,
    billableAmount,
    outletId,
    ...(locationId ? { locationId } : {}),
  };
  const primary = cred.asCode
    ? { ...basePayload, code: cred.token }
    : { ...basePayload, qrToken: cred.token };
  const fallback = swapVoucherCredential(basePayload, cred);

  try {
    let res = await fetch("/api/voucher/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(primary),
    });
    let json = await res.json();

    if (!res.ok && shouldRetryAlternateCredential(res.status, json)) {
      res = await fetch("/api/voucher/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fallback),
      });
      json = await res.json();
    }

    if (!res.ok) {
      showScanError(apiErrorMessage(json) || "Voucher check failed");
      return;
    }

    const data = unwrapApiData(json);
    if (!data.valid) {
      showScanError("This voucher cannot be redeemed (expired, fully used, or invalid).");
      return;
    }
    if (data.selectionValidation && data.selectionValidation.isSelectable === false) {
      showScanError(data.selectionValidation.reason || "Selection not allowed for this voucher.");
      return;
    }
    if (data.quoteError) {
      showScanError(data.quoteError);
      return;
    }
    if (!data.quote) {
      showScanError("Could not generate a quote. Check the billable amount and selection.");
      return;
    }

    currentVoucherPreview = {
      cred,
      payload: {
        ...basePayload,
        ...(cred.asCode ? { code: cred.token } : { qrToken: cred.token }),
        redemptionChannel: "QR_SCAN_RP",
      },
      data,
    };
    showVoucherPreview(data);
  } catch (e) {
    showScanError("Network error: " + e.message);
  } finally {
    btn.innerHTML = "🔍 Preview quote";
    updateVoucherPreviewButton();
  }
}

function showVoucherPreview(data) {
  const voucher = data.voucher || {};
  const mapping = data.mapping || {};
  const quote = data.quote || {};
  const block = document.getElementById("voucher-preview-block");
  const badge = document.getElementById("voucher-preview-badge");
  const details = document.getElementById("voucher-preview-details");

  badge.innerHTML =
    '<span class="status-badge badge-valid"><span class="dot dot-green"></span>READY TO REDEEM</span>';

  const rows = [
    ["Voucher", voucher.code || "—"],
    ["Passenger", voucher.passengerName || "—"],
    ["Program", voucher.programTitle || voucher.programCode || "—"],
    ["Outlet", formatOutletLabel(getSelectedOutlet())],
    ["Service", getSelectedService()?.displayName || "—"],
    ["Restriction", voucher.restriction || "—"],
    ["Usage", `${voucher.servicesRedeemedCount ?? 0} / ${voucher.servicesRedemptionCap ?? "—"}`],
    ["Redemption type", redemptionTypeLabel(mapping.redemptionType || quote.redemptionType)],
    ["Voucher value (cap)", fmtMoney(mapping.discountAmount ?? quote.voucherValue)],
    ["Billable amount", fmtMoney(quote.billableAmount)],
    ["Redeem value (voucher applies)", fmtMoney(quote.redeemValue)],
    ["Customer pays", fmtMoney(quote.customerPayAmount)],
  ];

  details.innerHTML =
    rows
      .map(
        ([k, v]) =>
          `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`
      )
      .join("") +
    `<div class="info-banner" style="margin-top:12px">
      <div class="info-title">Payment summary</div>
      Bill ${fmtMoney(quote.billableAmount)} · Voucher covers ${fmtMoney(quote.redeemValue)} ·
      Customer pays <strong>${fmtMoney(quote.customerPayAmount)}</strong>
      ${quote.isFullRedeem ? "<br><span style='color:var(--muted)'>Full redeem — guest pays nothing; voucher value is recorded against the bill.</span>" : "<br><span style='color:var(--muted)'>Discounted amount — guest pays the remainder after voucher discount.</span>"}
    </div>`;

  block.classList.remove("hidden");
  document.getElementById("voucher-redeem-btn").disabled = false;
}

async function redeemVoucher() {
  hideScanError();
  if (!currentVoucherPreview) {
    showScanError("Preview the voucher quote before redeeming.");
    return;
  }

  const btn = document.getElementById("voucher-redeem-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Redeeming…';

  const payload = currentVoucherPreview.payload;
  const cred = currentVoucherPreview.cred;
  const fallback = swapVoucherCredential(payload, cred);

  try {
    let res = await fetch("/api/voucher/redeem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let json = await res.json();

    if (!res.ok && shouldRetryAlternateCredential(res.status, json)) {
      res = await fetch("/api/voucher/redeem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fallback),
      });
      json = await res.json();
    }

    if (!res.ok) {
      btn.disabled = false;
      btn.innerHTML = "✅ Confirm redeem";
      showScanError(apiErrorMessage(json) || "Redeem failed");
      return;
    }

    const data = json.data || json;
    const voucher = data.voucher || {};
    const quote = data.quote || {};
    const stillOpen =
      voucher.status === "PARTIALLY_USED" ||
      (Number(voucher.servicesRedeemedCount) < Number(voucher.servicesRedemptionCap));

    stopVoucherCamera();
    clearVoucherPreview();
    document.getElementById("step-scan").classList.add("hidden");
    document.getElementById("step-redeem").classList.remove("hidden");
    document.getElementById("redeem-result").innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:56px;margin-bottom:12px">✅</div>
        <div class="section-heading">Voucher Redeemed</div>
        <p style="color:var(--muted);font-size:14px;margin-top:6px">${voucher.code || "Access voucher"} · ${voucher.status || ""}</p>
        <div class="divider"></div>
        <div class="detail-row"><span class="detail-label">Progress</span><span class="detail-value">${voucher.servicesRedeemedCount ?? "—"} / ${voucher.servicesRedemptionCap ?? "—"}</span></div>
        <div class="detail-row"><span class="detail-label">Billable</span><span class="detail-value">${fmtMoney(quote.billableAmount ?? data.billableAmount)}</span></div>
        <div class="detail-row"><span class="detail-label">Redeem value</span><span class="detail-value">${fmtMoney(quote.redeemValue ?? data.redeemValue)}</span></div>
        <div class="detail-row"><span class="detail-label">Customer paid</span><span class="detail-value">${fmtMoney(quote.customerPayAmount ?? data.customerPayAmount)}</span></div>
        <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${redemptionTypeLabel(data.redemptionType)}</span></div>
      </div>
      ${stillOpen ? '<button class="btn btn-validate" onclick="continueVoucherRedeem()">Redeem another service</button>' : ""}`;
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = "✅ Confirm redeem";
    showScanError("Network error: " + e.message);
  }
}

function shouldRetryAlternateCredential(status, json) {
  if (status === 404) return true;
  const msg = String(apiErrorMessage(json) || "").toLowerCase();
  return (
    msg.includes("not found") ||
    msg.includes("qrtoken") ||
    msg.includes("must be at least") ||
    msg.includes("validation")
  );
}

function continueVoucherRedeem() {
  document.getElementById("step-redeem").classList.add("hidden");
  document.getElementById("step-scan").classList.remove("hidden");
  clearVoucherPreview();
  document.getElementById("voucher-billable").value = "";
  void validateVoucherOnly();
}

function showBookingRedeemResult(json) {
  const data = json.data || json;
  document.getElementById("step-result").classList.add("hidden");
  document.getElementById("step-redeem").classList.remove("hidden");

  let html = "";
  if (data.success) {
    const already = data.alreadyRedeemed
      ? '<p style="color:var(--amber);font-size:13px;margin-top:8px">⚠️ Was already redeemed previously.</p>'
      : "";
    html = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:56px;margin-bottom:12px">✅</div>
        <div class="section-heading">Entry Granted</div>
        <p style="color:var(--muted);font-size:14px;margin-top:6px">Booking redeemed successfully</p>
        ${already}
        <div class="divider"></div>
        <div class="detail-row"><span class="detail-label">Booking Item</span><span class="detail-value" style="font-size:12px">${data.bookingItemId || "—"}</span></div>
        <div class="detail-row"><span class="detail-label">Redeemed At</span><span class="detail-value">${data.redeemedAt ? fmtTime(data.redeemedAt) : "—"}</span></div>
      </div>`;
  } else {
    html = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:56px;margin-bottom:12px">❌</div>
        <div class="section-heading">Redemption Failed</div>
        <div class="error-msg" style="margin-top:16px;text-align:left">⛔ ${humanRejection(data.error || "Unknown error")}</div>
      </div>`;
  }
  document.getElementById("redeem-result").innerHTML = html;
}

function resetAll() {
  currentValidation = null;
  if (voucherValidateTimer) clearTimeout(voucherValidateTimer);
  resetVoucherSession();
  clearVoucherPreview();
  stopVoucherCamera();
  hideDeepLinkLoading();
  document.getElementById("step-scan").classList.remove("hidden");
  document.getElementById("step-result").classList.add("hidden");
  document.getElementById("step-redeem").classList.add("hidden");
  document.getElementById("scheduled-block").classList.add("hidden");
  document.getElementById("token-input").value = "";
  document.getElementById("voucher-token-input").value = "";
  document.getElementById("voucher-billable").value = "";
  document.getElementById("outlet-input").value = "";
  hideScanError();
  switchVoucherInput("paste");
  switchCredentialType("voucher");
}

function showScanError(msg) {
  const el = document.getElementById("scan-error");
  el.textContent = msg;
  el.classList.remove("hidden");
}
function hideScanError() {
  document.getElementById("scan-error").classList.add("hidden");
}

function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString("en-IN", {
      timeZone: "Asia/Kolkata",
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", hour12: true,
    }) + " IST";
  } catch (_) { return iso; }
}

function fmtDate(dateStr) {
  try {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-IN", {
      day: "2-digit", month: "short", year: "numeric",
    });
  } catch (_) { return dateStr; }
}

function redemptionStatusLabel(isValid, canRedeemNow, redeemFromIso) {
  if (!isValid) return "—";
  if (canRedeemNow) return '<span style="color:var(--green)">Ready now</span>';
  if (redeemFromIso) return `<span style="color:var(--amber)">Opens ${fmtTime(redeemFromIso)}</span>`;
  return '<span style="color:var(--amber)">Not yet</span>';
}

function formatDurationMinutes(minutes) {
  const value = Number(minutes);
  if (!Number.isFinite(value) || value <= 0) return "—";
  if (value % 60 === 0) {
    const hours = value / 60;
    return hours === 1 ? "1 hour" : `${hours} hours`;
  }
  return `${value} min`;
}

function formatExtraHours(hours) {
  const value = Number(hours);
  if (!Number.isFinite(value) || value < 0) return "—";
  if (value === 0) return "None";
  return value === 1 ? "1 hour" : `${value} hours`;
}

function buildDurationBlock(ld) {
  const baseMinutes = ld.baseDurationMinutes;
  const extraHours = ld.extraHours;
  const totalMinutes = ld.totalDurationMinutes;
  const hasDuration =
    Number.isFinite(Number(baseMinutes)) ||
    Number.isFinite(Number(extraHours)) ||
    Number.isFinite(Number(totalMinutes)) ||
    ld.bookedDurationLabel;
  if (!hasDuration) return "";

  const baseLabel = formatDurationMinutes(baseMinutes);
  const extraLabel = formatExtraHours(extraHours);
  const totalLabel = ld.bookedDurationLabel || formatDurationMinutes(totalMinutes);
  const variantCode = ld.variantCode ? String(ld.variantCode).replace(/_/g, " ") : "";
  const serviceStart = ld.serviceStartTime || ld.redeemableFrom || ld.startTime;
  const serviceEnd = ld.serviceEndTime || ld.redeemableUntil || ld.expiresAt;

  return `
    <div class="duration-block">
      <div class="duration-title">Booked Lounge Duration</div>
      <div class="duration-grid">
        <div class="duration-item">
          <span class="duration-label">Base pass</span>
          <span class="duration-value">${baseLabel}</span>
          ${variantCode ? `<span class="duration-sub">${variantCode}</span>` : ""}
        </div>
        <div class="duration-item">
          <span class="duration-label">Extra</span>
          <span class="duration-value">${extraLabel}</span>
          <span class="duration-sub">beyond base</span>
        </div>
        <div class="duration-item total">
          <span class="duration-label">Total</span>
          <span class="duration-value">${totalLabel}</span>
          <span class="duration-sub">booked stay</span>
        </div>
      </div>
      <div class="duration-timeline">
        <div class="detail-row">
          <span class="detail-label">Entry</span>
          <span class="detail-value">${serviceStart ? fmtTime(serviceStart) : "—"}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Must exit by</span>
          <span class="detail-value">${serviceEnd ? fmtTime(serviceEnd) : "—"}</span>
        </div>
      </div>
    </div>`;
}

function buildScheduledMessage(data, redeemFromIso) {
  const bs = data.bookingSummary || {};
  const ld = data.loungeDetails || {};
  const redeemUntil = ld.redeemableUntil || ld.expiresAt || ld.serviceEndTime;
  const travelDate = bs.travelDate ? fmtDate(bs.travelDate) : "the travel date";
  const opensAt = redeemFromIso ? fmtTime(redeemFromIso) : "the scheduled time";
  const closesAt = redeemUntil ? fmtTime(redeemUntil) : "pass expiry";
  const durationSummary = ld.bookedDurationLabel
    ? `Total booked stay: <strong>${ld.bookedDurationLabel}</strong>`
    : "";

  let reason = "Redemption is not open yet.";
  const todayIst = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
  if (bs.travelDate && bs.travelDate > todayIst) {
    reason = `This is a <strong>future booking</strong> for ${travelDate}.`;
  } else if (redeemFromIso && new Date(redeemFromIso) > new Date()) {
    reason = "The redemption window has not started yet.";
  }

  return `
    <div class="info-title">Cannot redeem yet</div>
    <p>${reason}</p>
    ${durationSummary ? `<p style="margin-top:8px">${durationSummary} (base ${formatDurationMinutes(ld.baseDurationMinutes)}, extra ${formatExtraHours(ld.extraHours)}).</p>` : ""}
    <p style="margin-top:8px">Guest may enter from <strong>${opensAt}</strong> until <strong>${closesAt}</strong>.</p>
    <p style="margin-top:8px;color:var(--muted)">QR is valid — confirm entry only during the redemption window.</p>`;
}

function humanRejection(reason) {
  const map = {
    "Invalid or expired QR token": "Invalid or malformed QR token.",
    "Booking not found": "Booking not found in the system.",
    "QR token not recognized": "This QR token is not linked to any booking.",
    "Booking is not confirmed": "Booking is not in a confirmed state.",
    "Booking already redeemed": "This booking has already been redeemed.",
    "Booking is not active": "Booking item is not currently active.",
    "QR token expired": "QR token has expired.",
    "Outside redemption window": "Outside the valid redemption time window.",
    "Outlet mismatch": "QR code is not valid for this lounge outlet.",
    "Passenger count mismatch": "Passenger count mismatch.",
    "Booking date is not valid for today": "Travel date does not match today (IST).",
    "Booking item not found": "Booking item not found.",
  };
  return map[reason] || reason;
}

window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const deepLink =
    params.get("qrToken") || params.get("code") || params.get("token");
  if (deepLink) {
    showDeepLinkLoading();
    const raw =
      params.get("code") && !params.get("qrToken") && !params.get("token")
        ? `${window.location.origin}/?code=${encodeURIComponent(params.get("code"))}`
        : deepLink;
    void routeCredential(raw, "");
    return;
  }
  switchCredentialType("voucher");
});
</script>
